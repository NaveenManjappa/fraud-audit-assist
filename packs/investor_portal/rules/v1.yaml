# Investor portal rules, v1: per-Account rules only (no Link Graph).
# Windows are inclusive and measured on event time. Points add up within a Risk Episode, once per Rule.
version: v1
risk_period: 7d
bands: { medium: 30, high: 60, critical: 90 }

rules:
  - id: R0
    name: New device / new country
    kind: first_sighting
    fields: [device_id, country]
    points: 10
    explanation: "First sighting on this Account: {sighting}"

  - id: R1
    name: Recovery takeover
    kind: sequence
    steps:
      - types: [PasswordReset]
      - types: [MfaEnrolled]
    window: 1h
    points: 30
    explanation: "Password reset then MFA enrolment, {elapsed} apart; window {window}"

  - id: R2
    name: Contact hijack
    kind: sequence
    steps:
      - types: [PasswordReset]
      - types: [EmailChanged, PhoneChanged]
    window: 1d
    points: 20
    explanation: "Password reset then contact change, {elapsed} apart; window {window}"

  - id: R3
    name: Payout redirect
    kind: sequence
    steps:
      - types: [EmailChanged, PhoneChanged, AddressChanged]
      - types: [BankDetailsChanged]
    window: 3d
    points: 30
    explanation: "Contact change then bank-detail change, {elapsed} apart; window {window}"

  - id: R4
    name: Cash-out
    kind: sequence
    steps:
      - types: [BankDetailsChanged]
      - types: [SaleRequested, TransferRequested]
    window: 7d
    points: 40
    explanation: "Bank-detail change then sale or transfer, {elapsed} apart; window {window}"

  - id: R5
    name: Fast-track registration
    kind: sequence
    steps:
      - types: [AccountRegistered]
      - types: [BankDetailsChanged]
    window: 2d
    points: 30
    explanation: "Registration then bank-detail change, {elapsed} apart; window {window}"

  - id: R6
    name: Register-and-sell
    kind: sequence
    steps:
      - types: [AccountRegistered]
      - types: [SaleRequested, TransferRequested]
    window: 14d
    points: 30
    explanation: "Registration then sale or transfer, {elapsed} apart; window {window}"
