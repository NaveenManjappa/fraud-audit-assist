name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: faa
          POSTGRES_PASSWORD: faa
          POSTGRES_DB: faa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faa -d faa_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      FAA_TEST_POSTGRES_URL: postgresql+psycopg://faa:faa@localhost:5432/faa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest --cov --cov-report=term --cov-report=xml --cov-fail-under=85
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - name: Audit pinned dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > requirements.txt
          uv run pip-audit --requirement requirements.txt --disable-pip --no-deps --strict
      - name: Static security scan
        run: uv run bandit -q -c pyproject.toml -r src

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: fraud-audit-assist:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
